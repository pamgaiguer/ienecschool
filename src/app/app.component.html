<!-- LOGIN PÚBLICO OU ADMIN -->
<ng-container *ngIf="isLoginRoute() || isAdminLogin(); else routeHandler">
  <router-outlet></router-outlet>
</ng-container>

<!-- ROTAS PÚBLICAS E ROTAS ADMIN -->
<ng-template #routeHandler>
  <ng-container *ngIf="isAdminRoute(); else publicLayout">
    <router-outlet></router-outlet>
  </ng-container>

  <ng-template #publicLayout>
    <app-navbar></app-navbar>
    <router-outlet></router-outlet>
    <app-footer></app-footer>
  </ng-template>
</ng-template>
