<section class="container mx-auto my-20">
  <div
    *ngFor="let item of metodologiaItens"
    class="bg-white p-6 rounded-lg shadow-md flex flex-row items-center mb-10">
    <!-- Imagem à esquerda -->
    <div class="size-80 mr-8 rounded-lg flex items-center justify-center">
      <img [src]="item.src" alt="icons" class="max-w-full max-h-full" />
    </div>

    <!-- Texto à direita -->
    <div class="flex flex-col">
      <h2 class="text-left text-xl font-bold mb-4">{{ item.title }}</h2>
      <p class="text-gray-700 text-left">{{ item.description }}</p>
      <div *ngIf="item.competencias && item.competencias.length > 0">
        <br />
        <ul>
          <li *ngFor="let competencia of item.competencias">
            <strong>{{ competencia.titulo }}:</strong> {{ competencia.descricao }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
