<div class="p-6 max-w-2xl mx-auto bg-white border rounded shadow">
  <h2 class="text-xl font-semibold mb-4">{{ isEdit ? 'Editar' : 'Novo' }} Banner da Home</h2>

  <form (ngSubmit)="onSubmit()" [formGroup]="form">
    <div class="mb-4">
      <label class="block font-medium">Imagem</label>
      <input type="file" (change)="onFileChange($event)" />
    </div>

    <div *ngIf="imagemPreview" class="mb-4">
      <img [src]="imagemPreview" alt="Prévia da imagem" class="w-1000 h-40 object-cover" />
    </div>

    <div class="mb-4">
      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="ativo" />
        <span>Ativo</span>
      </label>
    </div>

    <div class="mb-4">
      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="usar_como_carrossel" />
        <span>Usar como carrossel</span>
      </label>
    </div>

    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="loading"
      class="flex items-center gap-2 px-4 py-2 border border-blueDefault text-blueDefault rounded hover:bg-blue-100 transition">
      {{ loading ? 'Salvando...' : isEdit ? 'Atualizar' : 'Criar' }}
    </button>
  </form>
</div>
