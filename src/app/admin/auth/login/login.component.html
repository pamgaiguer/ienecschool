<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <form (ngSubmit)="onSubmit()" class="bg-white p-6 rounded shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-4">Login do Admin</h2>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Login</label>
      <input [(ngModel)]="login" name="login" class="w-full border border-gray-300 rounded p-2" required />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Senha</label>
      <input
        [(ngModel)]="senha"
        name="senha"
        type="password"
        class="w-full border border-gray-300 rounded p-2"
        required />
    </div>

    <div *ngIf="error" class="text-red-500 text-sm mb-2">{{ error }}</div>

    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Entrar</button>
  </form>
</div>
