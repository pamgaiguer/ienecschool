<div class="min-h-screen flex">
  <div
    class="hidden md:flex w-1/2 bg-cover bg-center"
    style="background-image: url('../../../../assets/admin/ienec-home-admin.jpg')"></div>

  <div class="flex w-full md:w-1/2 items-center justify-center bg-gray-50">
    <form (ngSubmit)="onSubmit()" class="w-full max-w-sm p-6 bg-white shadow-md rounded">
      <img class="block mx-auto mb-4 h-16" src="../../../../assets/logo.png" alt="" />

      <div class="mb-4">
        <label class="block text-sm font-medium">Login</label>
        <input [(ngModel)]="login" name="login" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium">Senha</label>
        <input
          [(ngModel)]="senha"
          type="password"
          name="senha"
          class="w-full border border-gray-300 p-2 rounded"
          required />
      </div>

      <button class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700" type="submit">
        Entrar
      </button>
    </form>
  </div>
</div>
