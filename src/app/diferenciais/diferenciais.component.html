<app-banner></app-banner>
<section class="container mx-auto my-20">
  <h2 class="text-4xl font-bold mt-20 mb-10 text-center text-mainFontColor">
    Nossos Diferenciais
  </h2>
</section>
<section class="container mx-auto my-20">
  <div
    *ngFor="let item of diferenciaisItens"
    class="bg-white p-6 rounded-lg shadow-md flex flex-row items-center mb-10">
    <!-- Imagem circular à esquerda -->
    <div
      class="flex-shrink-0 w-24 h-24 mr-8 rounded-full overflow-hidden flex items-center justify-center">
      <img [src]="item.imgSrc" alt="icons" class="w-24 h-24 object-cover" />
    </div>

    <!-- Texto à direita -->
    <div class="flex flex-col">
      <h2 class="text-left text-xl font-bold mb-4">{{ item.title }}</h2>
      <p class="text-mainFontColor text-left">{{ item.description }}</p>
    </div>
  </div>
</section>
