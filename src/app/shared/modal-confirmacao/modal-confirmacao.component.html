<div
  *ngIf="visivel"
  tabindex="-1"
  class="fixed top-0 left-0 right-0 z-50 w-full p-4 overflow-x-hidden overflow-y-auto inset-0 h-modal max-h-full bg-black bg-opacity-50">
  <div class="relative w-full max-w-md max-h-full mx-auto mt-24">
    <div class="relative bg-white rounded-lg shadow">
      <!-- Cabeçalho -->
      <div class="flex items-start justify-between p-4 border-b rounded-t">
        <h3 class="text-xl font-semibold text-gray-900">
          {{ titulo || 'Confirmar Exclusão' }}
        </h3>
        <button
          type="button"
          class="text-gray-400 hover:text-gray-900 rounded-lg text-sm w-8 h-8"
          (click)="cancelar()">
          <span class="text-xl">×</span>
        </button>
      </div>

      <!-- Corpo -->
      <div class="p-6">
        <p class="text-base text-gray-500">
          {{ mensagem || 'Tem certeza que deseja excluir este item? Esta ação não pode ser desfeita.' }}
        </p>
      </div>

      <!-- Rodapé -->
      <div class="flex justify-end p-6 border-t space-x-2">
        <button
          (click)="cancelar()"
          class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">
          Cancelar
        </button>
        <button (click)="confirmar()" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">
          {{ textoConfirmar || 'Excluir' }}
        </button>
      </div>
    </div>
  </div>
</div>
